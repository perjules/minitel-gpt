[project]
name = "minitel-gpt"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1.2,<2",
    "pyserial==3.5",
    "pyfiglet==1.0.4",
    "requests>=2.32,<3",
    "cryptography>=38",
]

[project.optional-dependencies]
gmail = ["google-auth==2.62.0", "google-auth-oauthlib==1.5.0"]
pronote = ["pronotepy==2.15.7"]
printer = ["bleak>=1,<4", "Pillow>=11,<14"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[tool.uv]
package = false
required-version = ">=0.12.23,<0.14"

[tool.pytest.ini_options]
# pytest 9 preserves the existing unittest.TestCase.subTest behavior.
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Keep the existing namespace-package and cross-test helper imports working.
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
