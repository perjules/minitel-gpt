name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Read pinned uv version
        id: uv-version
        run: echo "version=$(cat config/uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v9
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install test dependencies
        run: uv sync --locked --all-extras --python python
      - name: Check compatibility exports
        run: uv run --locked --all-extras python scripts/export_requirements.py --check
      - name: Run offline tests
        run: uv run --locked --all-extras pytest
      - name: Lint Python
        run: uv run --locked --all-extras ruff check .
      - name: Check installer syntax
        run: bash -n install.sh scripts/install_*.sh
